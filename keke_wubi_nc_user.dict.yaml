将进酒　　　　君不见，黄河之水天上来，奔流到海不复回。　　　　君不见，高堂明镜悲白发，朝如青丝暮成雪。　　　　人生得意须尽欢，莫使金樽空对月。　　　　天生我材必有用，千金散尽还复来。　　　　烹羊宰牛且为乐，会须一饮三百杯。　　　　岑夫子，丹丘生，将进酒，杯莫停。　　　　与君歌一曲，请君为我倾耳听。　　　　钟鼓馔玉不足贵，但愿长醉不愿醒。　　　　古来圣贤皆寂寞，惟有饮者留其名。　　　　陈王昔时宴平乐，斗酒十千恣欢谑。　　　　主人何为言少钱，径须沽取对君酌。　　　　五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。	ufis
满江红　　　　怒发冲冠，凭阑处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲，白了少年头，空悲切。　　　　靖康耻，犹未雪；臣子恨，何时灭？驾长车，踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头，收拾旧山河，朝天阙。	iixa
陋室铭　　　　山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？	bpqq
桃花源记　　　　晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。　　　　林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。　　　　见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”　　　　既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。　　　　南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。	saiy
爱莲说　　　　水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。　　　　予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。	eayu
